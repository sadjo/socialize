twig:
    file_name_pattern: '*.twig'
    form_themes: ['form/socialize_theme.html.twig']
    globals:
        local_domain: '%app.local_domain%'
        app_version: '%app.version%'
        # Instance réservée aux comptes (temporaire) : liens des fils publics et de l'inscription masqués aux visiteurs.
        home_login_only: '%env(bool:HOME_LOGIN_ONLY)%'

when@test:
    twig:
        strict_variables: true
