framework:
    messenger:
        failure_transport: failed

        transports:
            # File stockée en base (transport Doctrine) : aucun Redis ni RabbitMQ nécessaire.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 2000
                    multiplier: 3
                    max_delay: 3600000
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            sync: 'sync://'

        routing:
            # Les messages des modules seront routés vers « async » ici.

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
