security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            # Connexion avec l'adresse e-mail ou le nom d'utilisateur (UserRepository::loadUserByIdentifier).
            entity:
                class: App\Core\Domain\Account\User
        # Personnes connectées avec leur compte Mastodon (MastodonUserRepository::loadUserByIdentifier).
        mastodon_users:
            entity:
                class: App\Integration\Mastodon\Domain\MastodonUser
        all_users:
            chain:
                providers: [app_users, mastodon_users]

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: all_users
            form_login:
                # Le formulaire ne connaît que les comptes de l'instance (mot de passe).
                provider: app_users
                login_path: app_login
                check_path: app_login
                username_parameter: identifier
                password_parameter: password
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours
                signature_properties: ['password']
            # 5 tentatives par minute et par adresse
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    # Un administrateur peut toujours publier.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_PUBLISHER, ROLE_INSTAGRAM_IMPORTER]

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/(publier|reglages|stories/nouvelle|stories/mes-stories|stories$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
