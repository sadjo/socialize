# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.name: 'Socialize'
    # Version affichée en bas du menu (tag v0.X.Y dans l'image de production, « dev » sinon).
    app.version: '%env(APP_VERSION)%'
    app.storage_dir: '%env(resolve:STORAGE_DIR)%'
    # Archives Instagram reçues (supprimées à la fin de l'import) et taille maximale d'une archive (20 Go).
    app.import_dir: '%app.storage_dir%/imports'
    app.import_max_size: 21474836480
    # Médias en attente d'envoi vers un compte Mastodon (supprimés après l'envoi), partagés avec les workers.
    app.mastodon_upload_dir: '%app.storage_dir%/mastodon'
    # Domaine des adresses du fédivers (@nom@domaine), déduit de DEFAULT_URI.
    app.local_domain: '%env(key:host:url:DEFAULT_URI)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Chaque classe de src/ est un service ; les modules suivent la structure
    # Domain / Application / Infrastructure décrite dans le document de conception.
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/'
            - '../src/*/*/Domain/'
            # Ouvert pour un import précis, pas un service.
            - '../src/Import/Instagram/Infrastructure/ArchiveReader.php'

    # Client HTTP des échanges avec les autres instances (remplacé dans les tests).
    federation.http_client:
        alias: http_client

    # Client HTTP des échanges avec Immich (remplacé dans les tests).
    immich.http_client:
        alias: http_client

    # Client HTTP de l'API Instagram (remplacé dans les tests) : Instagram n'est jamais sur le réseau privé.
    instagram.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    # Client HTTP des échanges avec Synology Photos (remplacé dans les tests).
    synology_photos.http_client:
        alias: http_client

    # Client HTTP des serveurs Mastodon (remplacé dans les tests) : un serveur Mastodon est public, et son adresse
    # vient de la personne qui se connecte.
    mastodon.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    # Client HTTP d'Openverse et des fournisseurs de musique (remplacé dans les tests) : les adresses
    # de fichiers viennent d'Openverse, le réseau privé de l'instance leur est fermé.
    openverse.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

when@test:
    parameters:
        app.import_dir: '%kernel.project_dir%/var/test-storage/imports'
        app.mastodon_upload_dir: '%kernel.project_dir%/var/test-storage/mastodon'
    services:
        # Faux envoi des notifications sur les appareils (Web Push).
        App\Tests\Support\FakePushSender: ~
        App\Core\Application\Notification\PushSender: '@App\Tests\Support\FakePushSender'
        # Fausse instance du fédivers pour les tests (voir tests/Federation), limitée au client de la fédération.
        App\Tests\Federation\FakeFediverse:
            public: true
        federation.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments: ['@App\Tests\Federation\FakeFediverse']
        # Fausse instance Immich pour les tests (voir tests/Integration).
        App\Tests\Integration\FakeImmich:
            public: true
        immich.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments: ['@App\Tests\Integration\FakeImmich']
        # Faux Instagram pour les tests (voir tests/Integration).
        App\Tests\Integration\FakeInstagram:
            public: true
        instagram.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments: ['@App\Tests\Integration\FakeInstagram']
        # Faux Synology Photos pour les tests (voir tests/Integration).
        App\Tests\Integration\FakeSynologyPhotos:
            public: true
        # Faux serveur Mastodon pour les tests (voir tests/Integration).
        App\Tests\Integration\FakeMastodon:
            public: true
        mastodon.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments: ['@App\Tests\Integration\FakeMastodon']
        synology_photos.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments: ['@App\Tests\Integration\FakeSynologyPhotos']
        # Faux Openverse pour les tests (voir tests/Integration).
        App\Tests\Integration\FakeOpenverse:
            public: true
        openverse.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments: ['@App\Tests\Integration\FakeOpenverse']
