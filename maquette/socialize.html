<title>Socialize</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Disposition : rail de navigation vitré à gauche, colonne de contenu centrée (fil de 470 px), rail contextuel à droite ; sur mobile, en-tête compact + barre d'onglets en bas */
:root{
  --bg:oklch(0.155 0.018 285); --surface:oklch(0.2 0.022 285); --surface-2:oklch(0.25 0.026 285);
  --line:oklch(0.36 0.025 285 / .65); --fg:oklch(0.96 0.008 285); --muted:oklch(0.74 0.022 285); --faint:oklch(0.58 0.02 285);
  --accent:oklch(0.74 0.15 292); --accent-soft:oklch(0.74 0.15 292 / .16); --coral:oklch(0.74 0.16 28);
  --glass:oklch(0.19 0.02 285 / .72); --scrim:oklch(0.07 0.01 285 / .74);
  --ok:oklch(0.78 0.14 160); --warn:oklch(0.82 0.14 80); --bad:oklch(0.72 0.18 25);
  --on-grad:oklch(0.99 0 0); --on-media:oklch(0.99 0 0); --media-shade:oklch(0.1 0.02 285 / .55);
  --grad:linear-gradient(125deg,oklch(0.6 0.19 268),oklch(0.65 0.2 305) 52%,oklch(0.74 0.16 32));
  --shadow:0 1px 2px oklch(0 0 0 / .3),0 16px 40px -18px oklch(0 0 0 / .6);
  --font-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --font-text:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-card:22px; --r-ctl:12px; --side-w:248px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:oklch(0.975 0.006 285); --surface:oklch(1 0 0); --surface-2:oklch(0.955 0.01 285);
  --line:oklch(0.9 0.012 285); --fg:oklch(0.21 0.025 285); --muted:oklch(0.47 0.025 285); --faint:oklch(0.6 0.02 285);
  --accent:oklch(0.52 0.2 290); --accent-soft:oklch(0.52 0.2 290 / .1); --coral:oklch(0.6 0.2 25);
  --glass:oklch(0.99 0.004 285 / .76); --scrim:oklch(0.2 0.02 285 / .55);
  --ok:oklch(0.52 0.13 160); --warn:oklch(0.6 0.15 70); --bad:oklch(0.55 0.2 25);
  --shadow:0 1px 2px oklch(0.3 0.02 285 / .08),0 16px 40px -18px oklch(0.3 0.05 285 / .25);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:oklch(0.975 0.006 285); --surface:oklch(1 0 0); --surface-2:oklch(0.955 0.01 285);
  --line:oklch(0.9 0.012 285); --fg:oklch(0.21 0.025 285); --muted:oklch(0.47 0.025 285); --faint:oklch(0.6 0.02 285);
  --accent:oklch(0.52 0.2 290); --accent-soft:oklch(0.52 0.2 290 / .1); --coral:oklch(0.6 0.2 25);
  --glass:oklch(0.99 0.004 285 / .76); --scrim:oklch(0.2 0.02 285 / .55);
  --ok:oklch(0.52 0.13 160); --warn:oklch(0.6 0.15 70); --bad:oklch(0.55 0.2 25);
  --shadow:0 1px 2px oklch(0.3 0.02 285 / .08),0 16px 40px -18px oklch(0.3 0.05 285 / .25);
  color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-text);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.25rem;font-weight:700} h3{font-size:1.02rem;font-weight:700}
p{margin:0}
small,.small{font-size:.82rem;color:var(--muted)}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:18px;height:18px}.i.xs{width:14px;height:14px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.85em}

/* ---------- Ossature ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);gap:28px;max-width:1340px;margin:0 auto}
.side{position:sticky;top:0;height:100dvh;padding-block:22px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 12px 22px;font:800 1.3rem/1 var(--font-display);letter-spacing:-.03em}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 6px 18px -6px oklch(0.6 0.2 300 / .7)}
.logo-mark::before{content:"";width:14px;height:14px;border-radius:50%;border:3px solid var(--on-grad);box-shadow:5px -5px 0 -3px var(--on-grad)}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:14px;color:var(--fg);font-weight:500;transition:background .15s}
.nav:hover{background:var(--surface-2)}
.nav.on{font-weight:700;background:var(--accent-soft)}
.nav.on .i{stroke-width:2.3;color:var(--accent)}
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--coral);color:var(--on-grad);font-size:.72rem;font-weight:700;display:grid;place-items:center}
.side .sep{height:1px;background:var(--line);margin:10px 12px}
.side .grow{flex:1}
main{min-width:0;padding-block:28px 110px}
.mtop{display:none}
.tabbar{display:none}
@media (min-width:768px) and (max-width:1199px){
  :root{--side-w:72px}
  .side .lbl,.logo span,.nav .badge{display:none}
  .nav{justify-content:center;padding:12px}
  .logo{justify-content:center;padding-inline:0}
}
@media (max-width:767px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{display:none}
  main{padding-block:10px 104px}
  .mtop{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
  .mtop .logo{padding:0;font-size:1.15rem;margin-right:auto}
  .mtop .logo-mark{width:28px;height:28px;border-radius:9px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;
    padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
  .tabbar a,.tabbar button{display:grid;place-items:center;width:48px;height:42px;border-radius:12px}
  .tabbar .on .i{stroke-width:2.4;color:var(--accent)}
  .tabbar .plus{background:var(--grad);color:var(--on-grad);width:52px;border-radius:14px}
}
.ib{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:var(--fg)}
.ib:hover{background:var(--surface-2)}

/* ---------- Boutons & contrôles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r-ctl);font-weight:600;font-size:.9rem;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.pri{background:var(--grad);color:var(--on-grad);border-color:transparent;box-shadow:0 8px 20px -10px oklch(0.6 0.2 300 / .8)}
.btn.ghost{background:transparent}
.btn.sm{height:30px;padding:0 12px;font-size:.82rem;border-radius:10px}
.btn.done{background:var(--surface-2);color:var(--muted)}
.lnk{color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;min-height:42px;padding:10px 14px;border-radius:var(--r-ctl);background:var(--surface-2);border:1px solid var(--line);outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:96px;line-height:1.5}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--on-grad);transition:transform .2s;box-shadow:0 1px 3px oklch(0 0 0 / .3)}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
.sw:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg button{flex:1;height:34px;border-radius:10px;font-weight:600;font-size:.88rem;color:var(--muted);padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--surface-2);color:var(--fg);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;font-size:.78rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:color-mix(in oklch,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in oklch,var(--warn) 15%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in oklch,var(--bad) 14%,transparent)}
.pill.idle{color:var(--muted);background:var(--surface-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.88rem;flex-basis:100%}
.note{font-size:.84rem;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--surface-2);display:flex;gap:8px;align-items:flex-start}
.note .i{color:var(--accent);margin-top:1px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.page{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-h .grow{flex:1;min-width:240px}
.page-h p{color:var(--muted);margin-top:6px;max-width:62ch}

/* ---------- Avatars & stories ---------- */
.av{display:grid;place-items:center;border-radius:50%;flex:none;color:var(--on-grad);font-weight:700;font-family:var(--font-display);
  background:linear-gradient(140deg,oklch(0.72 0.13 var(--h)),oklch(0.5 0.15 calc(var(--h) + 50)))}
.ring{padding:2.5px;border-radius:50%;background:var(--grad);flex:none;display:grid}
.ring.seen{background:var(--line)}
.ring>.av{box-shadow:0 0 0 2.5px var(--bg)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none;font-size:.75rem;color:var(--muted)}
.st span.n{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .add{position:relative}
.st .add::after{content:"+";position:absolute;right:0;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--grad);color:var(--on-grad);font-weight:800;display:grid;place-items:center;border:2.5px solid var(--bg);font-size:.95rem;line-height:1}

/* ---------- Accueil ---------- */
.home{display:grid;grid-template-columns:minmax(0,480px) 300px;gap:56px;justify-content:center}
.feed-col{min-width:0;display:flex;flex-direction:column;gap:14px}
.feed{display:flex;flex-direction:column;gap:22px}
.rail{display:flex;flex-direction:column;gap:18px;padding-top:8px;position:sticky;top:28px;align-self:start}
@media (max-width:1199px){.home{grid-template-columns:minmax(0,500px)}.rail{display:none}}
.sugg{display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .t{min-width:0;flex:1}
.who b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fedstat{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fedstat .big{font:800 1.6rem/1 var(--font-display)}
.foot{font-size:.75rem;color:var(--faint);line-height:1.7}

/* ---------- Carte de post ---------- */
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 14px}
.pmeta{flex:1;min-width:0}
.pname{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.9rem}
.psub{font-size:.78rem;color:var(--muted)}
.fed{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:10px}
.imp{height:22px;font-size:.7rem;padding:0 8px}
.media{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--surface-2);user-select:none}
.track{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;height:100%;position:relative}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.cnt{position:absolute;top:12px;right:12px;padding:3px 9px;border-radius:10px;font-size:.75rem;font-weight:700;background:var(--media-shade);color:var(--on-media);backdrop-filter:blur(8px)}
.nb{position:absolute;top:50%;translate:0 -50%;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(10px);color:var(--fg);opacity:0;transition:opacity .2s}
.media:hover .nb,.media:focus-within .nb{opacity:1}
.nb.prev{left:10px}.nb.next{right:10px}
.dots{position:absolute;bottom:12px;left:50%;translate:-50% 0;display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--on-media);opacity:.5;transition:all .3s}
.dots i.on{opacity:1;width:16px}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.burst svg{width:110px;height:110px;fill:var(--on-media);stroke:none;filter:drop-shadow(0 8px 24px oklch(0.6 0.2 20 / .6));animation:burst .9s ease-out forwards}
@keyframes burst{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.15);opacity:1}45%{transform:scale(.95)}80%{opacity:1}100%{transform:scale(1.1) translateY(-20px);opacity:0}}
.cw-veil{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:oklch(0.15 0.02 285 / .35);backdrop-filter:blur(34px);-webkit-backdrop-filter:blur(34px);color:var(--on-media);z-index:2}
.cw-veil b{display:block;font-family:var(--font-display);font-size:1.05rem;margin:6px 0 4px}
.cw-veil .btn{margin-top:12px;background:var(--media-shade);color:var(--on-media);border-color:oklch(1 0 0 / .25)}
.vid .play{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--media-shade);backdrop-filter:blur(10px);color:var(--on-media);transition:opacity .3s,transform .2s}
.vid .play .i{width:30px;height:30px;fill:currentColor;margin-left:4px}
.vid .vbar{position:absolute;left:14px;right:14px;bottom:14px;height:3px;border-radius:2px;background:oklch(1 0 0 / .3);overflow:hidden}
.vid .vbar span{display:block;height:100%;width:0;background:var(--on-media)}
.vid .dur{position:absolute;left:14px;bottom:24px;font-size:.75rem;font-weight:700;color:var(--on-media);text-shadow:0 1px 4px oklch(0 0 0 / .5)}
.vid.playing .play{opacity:0;transform:scale(.8)}
.vid.playing img{animation:kb 12s linear forwards}
.vid.playing .vbar span{animation:vb 12s linear forwards}
@keyframes kb{to{transform:scale(1.25) translate(-4%,3%)}}
@keyframes vb{to{width:100%}}
.acts{display:flex;align-items:center;gap:2px;padding:8px 8px 2px}
.acts .sp{flex:1}
.act{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;transition:transform .15s}
.act:active{transform:scale(.88)}
.act.liked .i{fill:var(--coral);stroke:var(--coral);animation:pop .35s}
.act.boosted .i{color:var(--ok);stroke-width:2.4}
.act.saved .i{fill:currentColor}
@keyframes pop{50%{transform:scale(1.3)}}
.pbody{padding:2px 16px 16px;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
.pbody .meta{color:var(--muted);font-size:.86rem}
.tag{color:var(--accent);font-weight:500}
.ago{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-top:3px}
.xp{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);padding:7px 10px;border-radius:10px;background:var(--surface-2);margin-top:4px;flex-wrap:wrap}
.xp .i{color:var(--accent)}
.svc{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:.6rem;font-weight:800;color:var(--on-grad);flex:none;letter-spacing:0}
.svc.ig{background:linear-gradient(135deg,oklch(0.6 0.2 330),oklch(0.72 0.17 50))}
.svc.fb{background:oklch(0.55 0.17 260)}
.svc.lg{width:40px;height:40px;border-radius:12px;font-size:.85rem}

/* ---------- Overlays ---------- */
.ov{position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.ov .x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:3;color:var(--on-media);background:var(--media-shade);border-radius:50%}
.pd{position:relative;width:min(1040px,100%);max-height:calc(100dvh - 48px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-radius:26px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(16px) scale(.98);opacity:0}}
.pd-media{position:relative;background:var(--bg);display:grid;place-items:center;overflow:hidden;min-height:0}
.pd-media .glow{position:absolute;inset:-20%;background-size:cover;background-position:center;filter:blur(60px) saturate(1.4);opacity:.75}
.pd-media .media{width:100%;max-height:calc(100dvh - 48px);border-radius:0;background:transparent}
.pd-side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
.pd-side .ph{border-bottom:1px solid var(--line)}
.cmts{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px;min-height:120px}
.cmt{display:flex;gap:10px;font-size:.9rem}
.cmt .t{flex:1;min-width:0}
.cmt small{display:flex;gap:12px;margin-top:3px}
.cmt.arch{opacity:.85}
.addc{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.addc .inp{min-height:38px;border-radius:19px}
@media (max-width:767px){
  .ov{place-items:end center;padding-inline:0;padding-bottom:0}
  .pd{grid-template-columns:1fr;border-radius:26px 26px 0 0;max-height:calc(100dvh - 40px);overflow-y:auto}
  .pd-side{border-left:0}
  .pd-media .media{max-height:60dvh}
}

/* ---------- Stories ---------- */
.sv{position:relative;height:min(86dvh,820px);aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);animation:rise .3s}
.sv>img{width:100%;height:100%;object-fit:cover;display:block}
.sv .bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:2}
.sv .bars i{flex:1;height:3px;border-radius:2px;background:oklch(1 0 0 / .35);overflow:hidden}
.sv .bars i span{display:block;height:100%;width:0;background:var(--on-media)}
.sv .bars i.done span{width:100%}
.sv .bars i.run span{animation:vb 5s linear forwards}
.sv .sh{position:absolute;top:24px;left:12px;right:12px;display:flex;align-items:center;gap:10px;color:var(--on-media);z-index:2;text-shadow:0 1px 4px oklch(0 0 0 / .45);font-size:.88rem}
.sv .sh .grow{flex:1;min-width:0}
.sv .stxt{position:absolute;left:8%;right:8%;top:58%;text-align:center;font:800 1.45rem/1.2 var(--font-display);color:var(--on-media);text-shadow:0 2px 16px oklch(0 0 0 / .55);text-wrap:balance}
.sv .tapl,.sv .tapr{position:absolute;top:70px;bottom:70px;z-index:1}
.sv .tapl{left:0;width:33%}.sv .tapr{right:0;width:67%}
.sv .sf{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;z-index:2}
.sv .sf .inp{background:oklch(0 0 0 / .25);border-color:oklch(1 0 0 / .4);color:var(--on-media);border-radius:22px;backdrop-filter:blur(8px)}
.sv .sf .inp::placeholder{color:oklch(1 0 0 / .8)}
.sv .xtag{position:absolute;bottom:66px;left:50%;translate:-50% 0;z-index:2;color:var(--on-media);background:var(--media-shade);backdrop-filter:blur(8px);padding:5px 10px;border-radius:12px;font-size:.75rem;display:flex;gap:6px;align-items:center;white-space:nowrap}

/* ---------- Composer ---------- */
.comp{width:min(980px,100%);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;background:var(--surface);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);animation:rise .3s}
.comp-h{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.comp-h h2{flex:1;text-align:center;font-size:1.02rem}
.comp-b{flex:1;overflow-y:auto;min-height:0}
.comp-f{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.comp-f .grow{flex:1;min-width:160px;font-size:.84rem;color:var(--muted)}
.src{display:flex;gap:6px;padding:14px 16px 0}
.drop{margin:16px;border:2px dashed var(--line);border-radius:20px;padding:44px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--muted)}
.drop .big{width:64px;height:64px;color:var(--accent)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.imm-h{display:flex;flex-direction:column;gap:12px;padding:14px 16px}
.albums{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.imm-date{padding:6px 16px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.imm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:4px;padding:0 16px 12px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.th .sel{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;border:2px solid var(--on-media);background:oklch(0 0 0 / .2);color:var(--on-grad);font-size:.75rem;font-weight:800;display:grid;place-items:center}
.th.on img{transform:scale(.88);border-radius:8px}
.th.on{outline:2px solid var(--accent);outline-offset:-2px}
.th.on .sel{background:var(--accent);border-color:var(--accent)}
.th .vd{position:absolute;left:7px;bottom:6px;font-size:.7rem;font-weight:700;color:var(--on-media);display:flex;gap:3px;align-items:center;text-shadow:0 1px 3px oklch(0 0 0 / .6)}
.th .vd .i{fill:currentColor;stroke:none}
.edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);min-height:100%}
.edit-prev{background:var(--bg);display:grid;place-items:center;padding:20px}
.edit-prev .media{width:min(420px,100%);border-radius:18px}
.edit-prev .sv{height:min(62dvh,600px);animation:none}
.edit-form{padding:18px;display:flex;flex-direction:column;gap:18px;border-left:1px solid var(--line)}
.alts{display:flex;flex-direction:column;gap:8px}
.alts .row img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2)}
.opt .grow b{display:block;font-size:.9rem}
.opt .grow small{display:block}
.counter{text-align:right;font-size:.75rem;color:var(--faint)}
@media (max-width:767px){
  .comp{border-radius:26px 26px 0 0;max-height:calc(100dvh - 30px)}
  .edit{grid-template-columns:1fr}
  .edit-form{border-left:0;border-top:1px solid var(--line)}
}

/* ---------- Profil ---------- */
.prof{max-width:935px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.prof-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px 48px;align-items:center;padding:10px 4% 0}
.prof-h .ring{padding:4px}
.prof-i{display:flex;flex-direction:column;gap:14px;min-width:0}
.prof-i .row{flex-wrap:wrap}
.prof-i h1{font-size:1.4rem}
.handle{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.82rem;color:var(--muted);padding:4px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats b{font-family:var(--font-display);font-size:1.05rem}
.bio{line-height:1.55;max-width:56ch}
.hls{display:flex;gap:22px;overflow-x:auto;padding:4px 4% 4px;scrollbar-width:none}
.hl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:600;flex:none}
.hl .c{width:72px;height:72px;border-radius:50%;padding:3px;border:1px solid var(--line);background:var(--bg)}
.hl .c img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ptabs{display:flex;justify-content:center;gap:40px;border-top:1px solid var(--line)}
.ptabs button{display:flex;align-items:center;gap:7px;height:50px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-top:2px solid transparent;margin-top:-1px}
.ptabs button.on{color:var(--fg);border-top-color:var(--fg)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.gt{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:6px;background:var(--surface-2)}
.gt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.gt:hover img{transform:scale(1.04)}
.gt .gi{position:absolute;top:8px;right:8px;color:var(--on-media);filter:drop-shadow(0 1px 3px oklch(0 0 0 / .6))}
.gt .gh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:18px;background:var(--media-shade);color:var(--on-media);font-weight:700;opacity:0;transition:opacity .2s}
.gt:hover .gh{opacity:1}
.gt .gh span{display:flex;gap:6px;align-items:center}
.gt .gh .i{fill:currentColor;stroke:none;width:20px;height:20px}
@media (max-width:767px){
  .prof-h{grid-template-columns:auto minmax(0,1fr);gap:14px 18px;padding:4px 0 0}
  .prof-h .ring .av{width:86px!important;height:86px!important;font-size:1.8rem!important}
  .bio,.prof-acts{grid-column:1/-1}
  .stats{gap:18px}
  .ptabs{gap:24px}
  .grid3{gap:2px}.gt{border-radius:3px}
  .hls{padding-inline:0}
}

/* ---------- Explorer ---------- */
.ex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:dense;gap:4px}
.ex-grid .gt{aspect-ratio:1}
.ex-grid .gt.tall{grid-row:span 2;aspect-ratio:auto}
.found{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.found .t{flex:1;min-width:160px}

/* ---------- Activité ---------- */
.notifs{display:flex;flex-direction:column}
.nf{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.nf:last-child{border-bottom:0}
.nf .t{flex:1;min-width:0}
.nf .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.nf img.mini{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}

/* ---------- Réglages ---------- */
.setl{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.subnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:28px}
.subnav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:500;text-align:left;color:var(--muted)}
.subnav button.on{background:var(--accent-soft);color:var(--fg);font-weight:700}
.subnav button.on .i{color:var(--accent)}
.setc{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:899px){
  .setl{grid-template-columns:minmax(0,1fr)}
  .subnav{flex-direction:row;overflow-x:auto;position:static;scrollbar-width:none;padding-bottom:2px}
  .subnav button{white-space:nowrap;flex:none}
}
.acct{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface-2);flex-wrap:wrap}
.acct .grow{flex:1;min-width:180px}
.acct .grow b{display:block}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.vars .chip{font-family:var(--font-mono);font-weight:500}
.preview-cap{white-space:pre-wrap;font-size:.86rem;padding:12px;border-radius:12px;border:1px dashed var(--line);color:var(--muted)}
pre.code{margin:0;padding:14px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font:500 .8rem/1.6 var(--font-mono);overflow-x:auto;white-space:pre}
.codebox{position:relative}
.codebox .btn{position:absolute;top:8px;right:8px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tool{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.82rem;color:var(--muted)}
.tool code{display:block;font:600 .82rem var(--font-mono);color:var(--fg);margin-bottom:2px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}

/* ---------- Import ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.step{display:flex;flex-direction:column;gap:8px;text-align:left;padding:4px 0;color:var(--faint);font-size:.82rem;font-weight:600}
.step::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.step.on{color:var(--fg)}
.step.on::before{background:var(--grad)}
.step.done{color:var(--muted)}
.step.done::before{background:var(--accent)}
.zip{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface-2);flex-wrap:wrap}
.zip .ico{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.zip .grow{flex:1;min-width:180px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpi{padding:14px;border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.kpi b{font:800 1.5rem/1.1 var(--font-display)}
.kpi small{font-size:.78rem}
.map td:first-child{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.map td:nth-child(2){color:var(--faint);width:24px}
.prog{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--grad);border-radius:5px;transition:width .3s}
.log{font:500 .78rem/1.7 var(--font-mono);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;height:210px;overflow-y:auto;color:var(--muted)}
.log .ok{color:var(--ok)}.log .w{color:var(--warn)}
.navbtns{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Admin ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tile b{font:800 1.6rem/1.1 var(--font-display)}
.tile small{font-size:.8rem}
@media (max-width:767px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dom{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.88rem;flex-wrap:wrap}
.dom .grow{flex:1;min-width:140px}

/* ---------- Divers ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;animation:up .25s}
.sheet::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(100%)}}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);animation:rise .25s}
@media (max-width:767px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface) 50%,var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.view{animation:vin .3s ease-out}
@keyframes vin{from{opacity:.4;transform:translateY(6px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

  const k=pal+seed+'-'+w+'x'+h; if(CACHE[k])return CACHE[k];
  const p=PAL[pal],r=rng(seed*9973+w),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);x.fillStyle=g;x.fillRect(0,0,w,h);
  if(pal==='night'){for(let i=0;i<220;i++){x.globalAlpha=r()*.9;x.fillStyle='#fff';const s=r()*1.8;x.fillRect(r()*w,r()*h*.6,s,s)}
    x.globalAlpha=.18;const mw=x.createLinearGradient(0,h*.1,w,h*.5);mw.addColorStop(0,'#000');mw.addColorStop(.5,'#d8c8ff');mw.addColorStop(1,'#000');x.fillStyle=mw;x.save();x.translate(w/2,h*.3);x.rotate(-.5);x.fillRect(-w,-40,w*2,80);x.restore();x.globalAlpha=1}

  x.fillStyle=p[2];x.beginPath();x.arc(sx,sy,sr,0,7);x.fill();

  const layers=water?2:3;
  for(let i=0;i<layers;i++){
    const base=h*(.5+i*.12),amp=h*(.12-i*.028);
    x.fillStyle=p[3+i];x.beginPath();x.moveTo(0,h);
    for(let xx=0;xx<=w;xx+=4){const t=xx/w;const y=base-amp*(.55*Math.sin(t*fr[0]+ph[0]+i*2)+.3*Math.sin(t*fr[1]+ph[1]+i)+.15*Math.sin(t*fr[2]+ph[2]+i*3));x.lineTo(xx,y)}

}

/* ---------- Stories ---------- */
function openStory(i,f=0){
  clearTimeout(S.svT);S.sv={i,f};const s=STORIES[i],p=who(s.by),fr=s.frames[f],url=fr.src||img(fr.pal,fr.seed,540,960);
  const inner=`<img src="${url}" alt="Story de ${p.user}">
    <div class="bars">${s.frames.map((_,k)=>`<i class="${k<f?'done':k===f?'run':''}"><span></span></i>`).join('')}</div>
    <div class="sh">${av(p,32)}<div class="grow"><b>${p.user}</b>${p.domain?` · ${p.domain}`:''} <span style="opacity:.8">· il y a ${3+i} h</span></div></div>
    ${fr.t?`<div class="stxt">${esc(fr.t)}</div>`:''}
    <button class="tapl" data-act="svprev" aria-label="Story précédente"></button><button class="tapr" data-act="svnext" aria-label="Story suivante"></button>
    <form class="sf" data-act="noop"><input class="inp" id="sv-r" placeholder="Répondre à ${p.user}…" autocomplete="off"><button class="ib" style="color:var(--on-media)" aria-label="Aimer">${ic('heart')}</button></form>`;
  const cur=$('#ov .ov.story');
  if(cur){
    /* Le fond assombri reste en place : seul le contenu de la story change, une fois la nouvelle image décodée */
    const tok=S.svTok=(S.svTok||0)+1,pre=new Image();pre.src=url;
    const swap=()=>{if(tok!==S.svTok||!S.sv)return;cur.setAttribute('aria-label','Story de '+p.user);$('.sv',cur).innerHTML=inner;S.svT=setTimeout(()=>storyStep(1),5000)};
    (pre.decode?pre.decode():Promise.resolve()).then(swap,swap);
    return;
  }
  $('#ov').innerHTML=`<div class="ov story" data-act="close" role="dialog" aria-modal="true" aria-label="Story de ${p.user}">
   <button class="ib x" data-act="close" aria-label="Fermer">${ic('x')}</button>
   <div class="sv">${inner}</div></div>`;
  S.svT=setTimeout(()=>storyStep(1),5000);
}
function storyStep(d){
  if(!S.sv)return;let {i,f}=S.sv;f+=d;
  if(f<0){i--;if(i<0)return openStory(0,0);f=STORIES[i].frames.length-1}
  if(f>=STORIES[i].frames.length){STORIES[i].seen=true;i++;f=0;if(i>=STORIES.length){closeOv();if(S.view==='accueil')render();return}}
  openStory(i,f);
}

function bindComp(){

/* ---------- Divers ---------- */
let toastT;
function toast(m){clearTimeout(toastT);$('#toast').innerHTML=`<div class="toast" role="status">${ic('check','sm')}${esc(m)}</div>`;toastT=setTimeout(()=>$('#toast').innerHTML='',3200)}
function copy(v,btn){
  const ok=()=>toast('Copié dans le presse-papiers');
  try{navigator.clipboard.writeText(v).then(ok,()=>fallback())}catch(e){fallback()}
  function fallback(){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('Sélectionnez le texte pour le copier')}t.remove()}
}
function slide(m,d){
  const n=+m.dataset.n;let i=Math.max(0,Math.min(n-1,+m.dataset.i+d));m.dataset.i=i;
  $('.track',m).style.transform=`translateX(-${i*100}%)`;
  $$('.dots i',m).forEach((x,k)=>x.classList.toggle('on',k===i));const c=$('.cnt',m);if(c)c.textContent=(i+1)+'/'+n;
}
function like(id,force){
  if(force&&S.likes.has(id))return;
  S.likes.has(id)?S.likes.delete(id):S.likes.add(id);
  $$(`[data-id="${id}"] .act[data-act="like"], .pd .act[data-act="like"]`).forEach(b=>b.classList.toggle('liked',S.likes.has(id)));
  const p=POSTS.find(x=>x.id===id);if(p)$$(`[data-id="${id}"] .pbody>div:first-child, .pd .pbody>div:first-child`).forEach(el=>el.outerHTML=likeLine(p));
}
function menu(){
  $('#ov').innerHTML=`<div class="ov" data-act="close" style="background:var(--scrim)"><div class="sheet" role="menu">
   ${NAV2.map(([k,l,i])=>`<a class="nav" href="#${k}" data-act="close">${ic(i)}${l}</a>`).join('')}
   <button class="nav" data-act="theme">${ic(isDark()?'sun':'moon')}${isDark()?'Thème clair':'Thème sombre'}</button></div></div>`;
}

/* ---------- Évènements ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,card=t.closest('[data-id]'),m=t.closest('.media');
  const pid=card?.dataset.id||m?.dataset.post||$('.pd [data-post]')?.dataset.post;
  switch(a){
    case 'close':if(e.target===t||t.tagName==='BUTTON'||t.tagName==='A'){if(t.tagName!=='A')e.preventDefault();closeOv()}break;
    case 'theme':{const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('socialize-theme',n)}catch(err){}if($('.sheet'))closeOv();renderNav();break}
    case 'feed':S.feed=t.dataset.k;render();break;
    case 'like':like(pid);break;
    case 'boost':S.boosts.has(pid)?S.boosts.delete(pid):S.boosts.add(pid);t.classList.toggle('boosted');if(S.boosts.has(pid))toast('Partagé avec vos abonnés du fédivers');break;
    case 'save':S.saved.has(pid)?S.saved.delete(pid):S.saved.add(pid);t.classList.toggle('saved');break;
    case 'share':copy(`https://${DOMAIN}/p/${pid}`);break;
    case 'more':toast('Menu : copier le lien, signaler, masquer l’instance…');break;
    case 'open':openPost(pid);break;
    case 'opengrid':openPost(['p2','p4','p1','p3','p5','p6'][(+t.dataset.i)%6]);break;
    case 'prev':slide(m,-1);break;
    case 'next':slide(m,1);break;
    case 'play':t.closest('.vid').classList.toggle('playing');break;
    case 'reveal':S.shown.add(pid);t.closest('.cw-veil').remove();break;
    case 'follow':{const u=t.dataset.u;S.follows.has(u)?S.follows.delete(u):S.follows.add(u);t.outerHTML=followBtn(u);if(S.follows.has(u))toast(`Abonnement envoyé à ${handle(who(u))}`);break}
    case 'followremote':t.className='btn sm done';t.textContent='Demande envoyée';toast('Activité Follow signée et envoyée');break;
    case 'story':openStory(+t.dataset.i);break;
    case 'svnext':storyStep(1);break;
    case 'svprev':storyStep(-1);break;
    case 'compose':e.preventDefault();openComposer(t.dataset.mode||'post');break;
    case 'cmode':S.comp.mode=t.dataset.k;drawComp();break;
    case 'csrc':S.comp.src=t.dataset.k;drawComp();break;
    case 'calbum':S.comp.album=+t.dataset.i;drawComp();break;
    case 'csel':{const c=S.comp,k=t.dataset.key,ix=c.sel.findIndex(s=>s.key===k);
      if(ix>=0)c.sel.splice(ix,1);else{let item=c.dev.find(d=>d.key===k);if(!item){for(const g of IMMICH)for(const [p,s,d] of g.items)if(p+s===k)item={key:k,pal:p,seed:s,dur:d}}if(item){if(c.mode==='story'&&c.sel.length>=10)return toast('10 éléments maximum par story');c.sel.push(item)}}
      const sc=$('.comp-b').scrollTop;drawComp();$('.comp-b').scrollTop=sc;break}
    case 'cnext':if(S.comp.sel.length){S.comp.step=2;drawComp()}break;
    case 'cback':S.comp.step=1;drawComp();break;
    case 'cvis':e.preventDefault();S.comp.vis=t.dataset.k;drawComp();break;
    case 'cpub':publish();break;
    case 'ptab':S.prof=t.dataset.k;render();break;
    case 'set':S.set=t.dataset.k;render();if(S.set==='crosspost')tplPrev();break;
    case 'impstep':S.imp.step=+t.dataset.s;render();if(S.imp.step===4)startImport();break;
    case 'copy':copy(t.dataset.v);break;
    case 'toast':toast(t.dataset.m);break;
    case 'seg':$$('button',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));toast(`Inscriptions : ${t.textContent.toLowerCase()}`);break;
    case 'menu':menu();break;
  }
});
document.addEventListener('dblclick',e=>{
  const m=e.target.closest('.media');if(!m||e.target.closest('button')||m.dataset.post==='draft')return;
  like(m.dataset.post,true);
  const b=document.createElement('div');b.className='burst';b.innerHTML='<svg viewBox="0 0 24 24"><use href="#i-heart"/></svg>';m.appendChild(b);setTimeout(()=>b.remove(),950);
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.classList.contains('addc')){const inp=$('input',f),v=inp.value.trim();if(!v)return;const p=POSTS.find(x=>x.id===f.dataset.post);p.comments.push(['me',v]);
    const el=document.createElement('div');el.className='cmt';el.innerHTML=`${av(ME,32)}<div class="t"><b>${ME.user}</b> ${tags(v)}<small><span>à l’instant</span></small></div>`;$('.cmts').appendChild(el);$('.cmts').scrollTop=1e6;inp.value='';
    if(S.view==='accueil')render();}
  else if(f.classList.contains('sf')){toast('Réponse envoyée en message privé')}
});
document.addEventListener('input',e=>{
  if(e.target.id==='ex-q'){S.ex=e.target.value;const q=S.ex.trim();$('#ex-r').innerHTML=exResult(q,/^@?[\w.]+@[\w-]+\.[\w.]+$/.test(q))}
  if(e.target.id==='tpl')tplPrev();
});
function tplPrev(){const t=$('#tpl'),p=$('#tpl-prev');if(!t||!p)return;p.textContent=t.value.replace('{legende}','Dernière baignade de la saison. L’eau était à 14 °C, personne d’autre n’a osé.').replace('{hashtags}','#normandie #mer #automne').replace('{lien}',`https://${DOMAIN}/p/8f3k2`).replace('{lieu}','Étretat').replace('{date}','12/11/2026')}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#ov').innerHTML)closeOv();
  if(S.sv&&e.key==='ArrowRight')storyStep(1);if(S.sv&&e.key==='ArrowLeft')storyStep(-1);
});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',renderNav);

/* ---------- Démarrage ---------- */
route();
const _r=render;render=function(){_r();if(S.view==='reglages'&&S.set==='crosspost')tplPrev();if(S.view==='import'&&S.imp.step===4)fillLog()};
if(S.view==='reglages')tplPrev();
</script>
