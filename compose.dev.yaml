# Développement : code monté depuis l'hôte, environnement dev, HTTP simple.
#   docker compose -f compose.yaml -f compose.dev.yaml up
# (ou plus simplement : make up)

services:
  app:
    image: socialize-dev
    build:
      target: frankenphp_dev
    restart: "no"
    environment:
      APP_ENV: dev
      APP_SECRET: dev-secret-ne-pas-utiliser-en-production
      SERVER_NAME: ":80"
      DEFAULT_URI: "http://localhost:${HTTP_PORT:-8080}"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      # Une base par environnement (var/app_dev.db, var/app_test.db) : les tests ne vident pas la base de dev.
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/app_%kernel.environment%.db"
    ports: !override
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/app
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true
