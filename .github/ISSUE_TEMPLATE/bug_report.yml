name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of the side menu, or the image tag you run.
      placeholder: v0.9.15
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, MariaDB, MySQL]
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, Firefox on Linux…
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `docker compose logs app` (remove any secret).
      render: text
