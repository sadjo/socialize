name: Wiki

# Publishes docs/wiki/*.md to the GitHub wiki of the repository.
# The wiki must have been initialised once (create any page from the Wiki tab).
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', 'docs/guide/**', 'tools/guide/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # User guide pages (User-Guide, Guide-d-utilisation) are built from docs/guide, also shown in the app (/aide).
      - name: Build the user guide pages
        run: |
          pip install --quiet pyyaml
          python tools/guide/build.py wiki docs/wiki
      - name: Push pages to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "$(git -C .. log -1 --format=%an)"
          git config user.email "$(git -C .. log -1 --format=%ae)"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
          else
            git commit -m "docs: sync wiki with ${GITHUB_SHA::7}"
            git push
          fi
