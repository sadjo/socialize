name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/assets/**', 'docs/guide/**', 'tools/guide/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp -r docs/assets/. _site/assets/
          cp public/icons/icon.svg _site/assets/icon.svg
          cp install.sh _site/install.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # User guide pages (guide/, guide/fr/) built from docs/guide, also shown in the app (/aide).
      - name: Build the user guide
        run: |
          pip install --quiet markdown pyyaml
          python tools/guide/build.py site _site --template site/_guide.html
          rm _site/_guide.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
