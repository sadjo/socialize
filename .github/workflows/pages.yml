name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/assets/**', 'docs/guide/**', 'tools/guide/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp -r docs/assets/. _site/assets/
          cp public/icons/icon.svg _site/assets/icon.svg
          cp install.sh _site/install.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # User guide pages (guide/, guide/fr/) built from docs/guide, also shown in the app (/aide).
      - name: Build the user guide
        run: |
          pip install --quiet markdown pyyaml
          python tools/guide/build.py site _site --template site/_guide.html
          rm _site/_guide.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # Just after the upload, GitHub sometimes does not list the artifact yet ("No artifacts named github-pages"):
      # one more try after a short wait.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
