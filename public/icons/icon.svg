<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône de l'application (écran d'accueil) : le logo de Socialize (.logo-mark), fond plein. Proportions du
       logo réduites à 90 % pour que le motif reste dans la zone sûre des icônes « maskable » d'Android
       (cercle central de 80 %). Le point est derrière l'anneau, comme l'ombre du logo. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f5bd5"/>
      <stop offset=".5" stop-color="#a24fd0"/>
      <stop offset="1" stop-color="#f08a6b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <circle cx="324" cy="188" r="95" fill="#fff"/>
  <circle cx="256" cy="256" r="136" fill="url(#g)"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#fff" stroke-width="41"/>
</svg>
